# CI for TIA itself (UC1-29). The same steps run locally with:  python "Project TIA/tools/ci.py"
# Nothing here needs a secret: the tests use an embedded PostgreSQL (pgserver), local git repositories and in-process fakes of GitHub,
# an OpenID Connect provider and a SAML identity provider. Third-party actions are pinned by tag (see Project TIA/docs/CI.md on SHA pinning).
name: tia-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # the least this workflow needs; it never writes to the repository

concurrency:
  group: tia-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: "Project TIA"

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: "Project TIA/pyproject.toml"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"
      - name: "Tests (functional gate - every acceptance test, real PostgreSQL with row-level security)"
        run: python -m pytest tests -q -p no:cacheprovider --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: "Project TIA/test-results.xml"

  container:
    name: image builds, Compose file is valid
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t tia:ci .
      - name: The image runs as a non-root user and every command starts
        run: |
          test "$(docker run --rm --entrypoint id tia:ci -u)" = "10001"
          docker run --rm tia:ci tia.migrate --help
          docker run --rm tia:ci tia.tenants --help
      - name: The Compose file is valid
        run: |
          mkdir -p deploy/secrets && for s in db_owner_password admin_dsn app_password worker_password app_dsn worker_dsn audit_key master_key metrics_token; do echo x > deploy/secrets/$s; done
          TIA_TENANT_ID=00000000-0000-0000-0000-000000000000 TIA_PUBLIC_URL=https://tia.example.com docker compose -f deploy/docker-compose.yml config -q

  hygiene:
    name: package, dependencies, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip build pip-audit
          python -m pip install -e ".[api,dev]"
      - name: The wheel carries the migrations and the web UI (a missing migration is a broken install)
        run: python tools/ci.py --only package
      - name: Every migration is numbered, ordered and unique; every tenant table is registered with the runtime
        run: python tools/ci.py --only migrations
      - name: No credential-shaped strings in the repository (tests build theirs at run time)
        run: python tools/ci.py --only secrets
      - name: "Dependencies with known vulnerabilities (security gate - no open critical/high)"
        run: python -m pip_audit --strict --progress-spinner off
