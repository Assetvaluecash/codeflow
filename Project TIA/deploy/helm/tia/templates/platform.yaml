apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels: {{- include "tia.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade          # the schema is migrated before any new pod starts
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "tia.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["tia.migrate"]
          env:
            - {name: TIA_ADMIN_DATABASE_URL_FILE, value: /run/secrets/tia/admin-dsn}
            - {name: TIA_APP_PASSWORD_FILE, value: /run/secrets/tia/app-password}
            - {name: TIA_WORKER_PASSWORD_FILE, value: /run/secrets/tia/worker-password}
          {{- include "tia.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets/tia, readOnly: true}
      volumes:
        - name: secrets
          secret: {secretName: {{ .Values.existingSecret }}, defaultMode: 0400}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-repos
  labels: {{- include "tia.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep                    # uploaded code lives here: never deleted with the release
spec:
  accessModes: [{{ .Values.workspace.accessMode }}]
  {{- if .Values.workspace.storageClass }}
  storageClassName: {{ .Values.workspace.storageClass }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.workspace.size }}}}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  tls: [{hosts: [{{ .Values.ingress.host }}], secretName: {{ .Values.ingress.tlsSecret }}}]
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-api, port: {name: http}}}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080}, {port: 9090}]
  egress:
    - to: [{ipBlock: {cidr: {{ .Values.networkPolicy.databaseCidr }}}}]
      ports: [{port: 5432}]
    - ports: [{port: 443}, {port: 53, protocol: UDP}, {port: 53, protocol: TCP}]    # git hosts, identity providers, Vault; DNS
{{- end }}
