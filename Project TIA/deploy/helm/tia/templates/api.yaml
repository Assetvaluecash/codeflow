apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "tia.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {{- include "tia.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      {{- include "tia.podSecurity" . | nindent 6 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["tia.server"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: TIA_HOST, value: "0.0.0.0"}
            - {name: TIA_PORT, value: "8080"}
            - {name: TIA_AUTH_REQUIRED, value: "true"}
            - {name: TIA_HSTS, value: "true"}
            - {name: TIA_PUBLIC_URL, value: {{ required "publicUrl is required" .Values.publicUrl | quote }}}
            - {name: TIA_TENANT_ID, value: {{ required "defaultTenantId is required" .Values.defaultTenantId | quote }}}
            - {name: TIA_DATABASE_URL_FILE, value: /run/secrets/tia/app-dsn}
            {{- include "tia.commonEnv" . | nindent 12 }}
          {{- include "tia.containerSecurity" . | nindent 10 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          volumeMounts: {{- include "tia.mounts" . | nindent 12 }}
      volumes: {{- include "tia.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "tia.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-api
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
