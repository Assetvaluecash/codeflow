[build-system]
requires = ["setuptools>=84.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tia"
version = "1.0.0"
description = "TIA - Technical Impact Analysis (Phase 1: cross-repository REST impact)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "tree-sitter>=0.23", "tree-sitter-java>=0.23", "tree-sitter-go>=0.23", "tree-sitter-c-sharp>=0.23",
                "tree-sitter-kotlin>=1.0", "tree-sitter-typescript>=0.23", "tree-sitter-javascript>=0.23",
                "cryptography>=42"]

[project.optional-dependencies]
api = ["fastapi>=0.100", "httpx", "uvicorn", "python-multipart", "signxml>=4", "lxml>=5"]
dev = ["pytest", "pgserver"]

[project.scripts]
tia = "tia.cli:main"

[tool.setuptools]
packages = ["tia"]

[tool.setuptools.package-data]
tia = ["web/*.html", "web/vendor/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
